<section class="contact-form-11 pt-0">
    <div class="container-fluid p-0 pb-5">
        <div style="height:300px" data-component-maps>
            <iframe loading="lazy" frameborder="0" title="map" src="https://maps.google.com/maps?q=Auckland,New+Zealand&z=15&t=q&key=&output=embed" width="100%" height="100%" style="width:100%;height:100%;left:0px">
            </iframe>
        </div>
    </div>
    <div class="container">
        <div class="row pt-5">
            <div class="col-12">
                <form hx-post="/contact" hx-disabled-elt="find button">
                    <div class="row">
                        <div class="col-12">
                            <label>Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <label>Your Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <label>Subject</label>
                            <input type="text" class="form-control" name="subject">
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col">
                            <label>How can we help?</label>
                            <textarea class="form-control" name="message" rows="5" required></textarea>
                        </div>
                    </div>
                    <div class="row mt-4 text-center">
                        <div class="col">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
