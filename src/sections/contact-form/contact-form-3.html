<section class="contact-form-12 py-0">
    <div class="container py-5" style="background-image: url(img/sections/contct-form-12.jpg);">
        <div class="row text-center justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <h1>Contact Us</h1>
                <p class="lead">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas cursus in lectus ut dignissim.
                </p>
            </div>
        </div>

        <div class="row-50">
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <form hx-post="/contact" hx-disabled-elt="find button">
                    <div class="row">

                        <div class="col">
                            <label>Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>

                        <div class="col">
                            <label>Email Address</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <label>Subject</label>
                            <input type="text" class="form-control" name="subject">
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <label>How can we help?</label>
                            <textarea class="form-control" name="message" rows="5" required></textarea>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col text-end">
                            <button type="submit" class="btn btn-dark">Send</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="row-100"></div>
    </div>

    <div class="container-fluid p-0">

        <div style="height:300px" data-component-maps>
            <iframe loading="lazy" frameborder="0" title="map" src="https://maps.google.com/maps?q=Auckland,New+Zealand&z=15&t=q&key=&output=embed" width="100%" height="100%" style="width:100%;height:100%;left:0px">
            </iframe>
        </div>

    </div>

</section>
