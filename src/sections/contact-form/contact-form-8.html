<section class="contact-form-8 pt-0">
    <div class="container-fluid p-0 pb-3">
        <div style="height:300px" data-component-maps>
            <iframe loading="lazy" frameborder="0" title="map"
                    src="https://maps.google.com/maps?q=Auckland,New+Zealand&z=15&t=q&key=&output=embed" width="100%"
                    height="100%" style="width:100%;height:100%;left:0px">
            </iframe>
        </div>
    </div>
    <div class="container">
        <div class="row text-center justify-content-center pt-5">
            <div class="col-12 col-md-7">
                <h1>Contact Us</h1>
            </div>
        </div>

        <div class="row justify-content-center pt-4">
            <div class="col-12 col-md-7">
                <form hx-post="/contact" hx-disabled-elt="find button">
                    <div class="row">
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Name" name="name" required>
                        </div>

                        <div class="col">
                            <input type="email" class="form-control" placeholder="Email" name="email" required>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <input type="text" class="form-control" placeholder="Subject" name="subject">
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col">
                            <textarea class="form-control" name="message" rows="5" placeholder="How can we help?"></textarea>
                        </div>
                    </div>
                    <div class="row mt-4">
                        <div class="col text-center">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="row-100"></div>
    </div>

    <div class="container pt-5">
        <div class="row justify-content-center text-center align-items-center">
            <div class="col-12 col-md me-auto ms-auto">
                <p class="lead">022 4020 111</p>
            </div>

            <div class="col-12 col-md pt-4 me-auto ms-auto">
                <p class="lead">10 Main Street<br>Auckland, 1010</p>
            </div>

            <div class="col-12 col-md pt-4 me-auto ms-auto">
                <p class="lead">support@yourcompany.com</p>
            </div>
        </div>
        <div class="row-50"></div>
    </div>

</section>
