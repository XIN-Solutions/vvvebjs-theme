<section class="contact-form-6">
  <div class="container-fluid g-0">

    <div style="height:300px" data-component-maps>
      <iframe loading="lazy" frameborder="0" title="map" src="https://maps.google.com/maps?q=Auckland,New+Zealand&z=15&t=q&key=&output=embed" width="100%" height="100%" style="width:100%;height:100%;left:0px">
      </iframe>
    </div>

  </div>
  <div class="container">
    <div class="row my-5">
      <div class="col-12 col-md-6 col-lg-5">
        <h2>Contact Us</h2>
        <p class="lead">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas cursus in lectus ut dignissim.
        </p>

        <p class="lead">
          Aliquam tempor porttitor velit a consectetur. Sed rhoncus sagittis euismod.
        </p>

        <div data-v-component-site>
          <p class="mt-5">
            <span>
              <i class="la la-lg la-envelope opacity-50"></i> Email:
            </span>
            <span>
              <a href="mailto:contact@mysite.com">
                contact@mysite.com
              </a>
            </span>
          </p>
          <p class="">
            <span>
              <i class="la la-lg la-phone opacity-50"></i> Phone:
            </span>
            <a href="tel:0224020111">022 4020 111</a>
          </p>
        </div>
      </div>

      <div class="col-12 col-md-6 ms-auto">

        <form hx-post="/contact" hx-disabled-elt="find button">

          <div class="row">
            <div class="col">
              <input type="text" class="form-control" placeholder="Name" name="name" required>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col">
              <input type="email" class="form-control" placeholder="Enter email" name="email" required>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col">
              <input type="text" class="form-control" placeholder="Subject" name="subject">
            </div>
          </div>

          <div class="row mt-4">
            <div class="col">
              <textarea class="form-control" name="message" rows="5" placeholder="How can we help?" required></textarea>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col">
              <button type="submit" class="btn btn-primary">
                Submit
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
