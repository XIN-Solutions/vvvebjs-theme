<section class="contact-form-13">
  <div class="container">
    <div class="row text-center justify-content-center">
      <div class="col-12 col-md-8 col-lg-7">
        <h1>Contact Us</h1>
        <p class="lead">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Maecenas cursus in lectus ut dignissim.
        </p>
      </div>
    </div>
    <div class="row-70"></div>
    <div class="row">
      <div class="col-12 col-md-8 col-lg">
        <form hx-post="/contact" hx-disabled-elt="find button">
          <div class="row">
            <div class="col">
              <input type="text" class="form-control" placeholder="Name" name="name" required>
            </div>

            <div class="col">
              <input type="email" class="form-control" placeholder="Enter email" name="email" required>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col">
              <input type="text" class="form-control" placeholder="Subject" name="subject">
            </div>
          </div>
          <div class="row mt-4">
            <div class="col">
              <textarea class="form-control" name="message" rows="5" placeholder="How can we help?" required></textarea>
            </div>
          </div>
          <div class="row mt-4">
            <div class="col">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
          </div>
        </form>
      </div>

      <div class="col-12 col-md-8 col-lg pt-5 pt-lg-0">

        <div style="height:200px" data-component-maps>
          <iframe loading="lazy" frameborder="0" title="map" src="https://maps.google.com/maps?q=Auckland,New+Zealand&z=15&t=q&key=&output=embed" width="100%" height="100%" style="width:100%;height:100%;left:0px">
          </iframe>
        </div>

        <p>
          <strong>Showroom</strong>
        </p>
        <p>
          1 Showroom Street
          <br>Chevy Chase, MD 20815
        </p>
      </div>
    </div>
  </div>
</section>
